# Legacy-to-target migration process, one work unit at a time.
#
# This process is intentionally generic. Project-specific legacy paths, target contract paths,
# verification commands, deploy environment names, fixture locations, and work-unit vocabulary live
# in `.claude/rules/migration-conventions.md`.

process: migration
issue_label: migration
description: Analyze legacy code, design the microservice target mapping, migrate implementation, then unit test, integration test, and deploy with manual test.

phases:
  - id: analyze
    agent: legacy-code-analyzer
    branch: docs/<issue>-<name>
    artifact: characterization report and legacy evidence artifacts from migration conventions
    link: intermediate
    entry_gate: none
    exit_gate: change_request_merged

  - id: design
    agent: microservice-target-architect
    branch: migrate/arch-<issue>-<name>
    artifact: target migration architecture from migration conventions
    link: intermediate
    entry_gate: change_request_merged:analyze
    exit_gate: change_request_merged

  - id: migrate
    agent: springboot-migrator
    branch: migrate/dev-<issue>-<name>
    artifact: code, tests, parity assets, progress artifact, and implementation verification report
    link: intermediate
    entry_gate: change_request_merged:design
    exit_gate:
      all_of: [migration_review_approved, change_request_merged]

  - id: unit_test
    agent: springboot-migration-verifier
    branch: migrate/unit-<issue>-<name>
    artifact: unit and domain-scoped verification evidence
    link: intermediate
    entry_gate: change_request_merged:migrate
    exit_gate:
      all_of: [domain_migration_checks_green, change_request_merged]

  - id: integration_test
    agent: springboot-migration-verifier
    branch: migrate/integration-<issue>-<name>
    artifact: contract, rules parity, cross-domain regression, and local health verification evidence
    link: intermediate
    entry_gate: change_request_merged:unit_test
    exit_gate:
      all_of:
        - contract_verified
        - rules_parity_verified
        - cross_domain_regression_green
        - springboot_app_health_checked
        - change_request_merged

  - id: deploy_and_manual_test
    agent: legacy-parity-verifier
    branch: migrate/deploy-<issue>-<name>
    artifact: deployment record and remote API parity and manual test verification evidence
    link: final
    entry_gate: change_request_merged:integration_test
    exit_gate:
      all_of:
        - deployed_to_environment
        - api_parity_verified
        - manual_test_passed
        - change_request_merged

done_label: phase:done
